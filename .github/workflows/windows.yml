name: Windows x64 distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      AURORA_NO_AUDIO: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt 6.8.3 MSVC 2022
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtmultimedia qtwebchannel qtpositioning qtimageformats qtshadertools
          cache: true
          cache-key-prefix: aurora86-windows-qt683-msvc2022
      - name: Configure
        run: >-
          cmake -S . -B work/windows-build
          -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON
      - name: Build native applications and tests
        run: cmake --build work/windows-build --config Release --parallel 4
      - name: Test core, packages, login and desktop
        run: ctest --test-dir work/windows-build -C Release --output-on-failure
      - name: Deploy runtime, verify and create ZIP and installer
        run: >-
          ./packaging/windows/package.ps1
          -BuildDirectory work/windows-build
          -QtRoot "$env:QT_ROOT_DIR"
          -OutputDirectory outputs
      - name: Upload ready-to-run Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AURORA86-Windows-x86_64
          path: |
            outputs/AURORA86-Windows-x86_64.zip
            outputs/AURORA86-Windows-x86_64.zip.sha256
            outputs/AURORA86-Setup-x64.exe
            outputs/AURORA86-Setup-x64.exe.sha256
            outputs/SHA256SUMS-Windows.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics if anything failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AURORA86-Windows-diagnostics
          path: |
            work/windows-build/Testing/Temporary/
            outputs/windows-*.log
          if-no-files-found: ignore
          retention-days: 7
